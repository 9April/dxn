<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Fonts: Cairo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <title>تفاصيل المنتج | DXN & KALLOW MAROC</title>
  <meta name="description" content="اكتشف تفاصيل المنتج والمكونات وطريقة الاستخدام. منتجات أصلية مع توصيل سريع 24/48 ساعة بالمغرب والدفع عند الاستلام.">
  
  <link rel="stylesheet" href="assets/css/base.css?v=41">
  <link rel="stylesheet" href="assets/css/components.css?v=41">
  <link rel="stylesheet" href="assets/css/pages.css?v=41">
  <link rel="stylesheet" href="assets/css/animations.css?v=4">
</head>
<body>

  <!-- Dynamic Header Container -->
  <div id="site-header-container"></div>

  <!-- Main PDP Content -->
  <main id="pdp-main-content">
    <div class="container section-spacing">
      
      <!-- 2-Column PDP Grid -->
      <div class="pdp-layout">
        
        <!-- Left: Image Gallery & Zoom -->
        <section class="pdp-gallery" id="pdp-gallery-container">
          <!-- Rendered dynamically by product.js?v=31 -->
        </section>

        <!-- Right: Product Information & Purchase Controls -->
        <section class="pdp-info" id="pdp-info-container">
          <!-- Rendered dynamically by product.js?v=31 -->
        </section>

      </div>

      <!-- Related / Recommended Products Section -->
      <section style="margin-top: clamp(60px, 8vw, 100px); padding-top: 48px; border-top: 1px solid var(--color-border);">
        <div class="section-header text-center">
          <span class="badge" id="pdp-related-badge" style="background: var(--color-bg-secondary); color: var(--color-dark); margin-bottom: 8px;">تشكيلة راقية للصحة والجمال</span>
          <h2 id="pdp-related-title">منتجات موصى بها</h2>
          <p class="section-subtitle" id="pdp-related-subtitle">اكتشف منتجات طبيعية أصلية لإكمال روتينك الصحي واليومي.</p>
        </div>

        <div class="product-grid-4col" id="pdp-related-grid">
          <!-- Rendered dynamically -->
        </div>
      </section>

    </div>
  </main>

  <!-- Dynamic Footer Container -->
  <div id="site-footer-container"></div>

  <!-- Core Scripts -->
  <script src="assets/js/config.js?v=41"></script>
  <script src="assets/js/i18n.js?v=41"></script>
  <script src="assets/js/data/categories.js?v=32"></script>
  <script src="assets/js/data/collections.js?v=32"></script>
  <script src="assets/js/data/products.js?v=32"></script>
  <script src="assets/js/core/storage.js?v=19"></script>
  <script src="assets/js/core/utils.js?v=41"></script>
  <script src="assets/js/core/cart.js?v=25"></script>
  <script src="assets/js/core/wishlist.js?v=19"></script>
  <script src="assets/js/core/search.js?v=19"></script>
  <script src="assets/js/components/toast.js?v=19"></script>
  <script src="assets/js/components/header.js?v=41"></script>
  <script src="assets/js/components/footer.js?v=41"></script>
  <script src="assets/js/components/productCard.js?v=41"></script>
  <script src="assets/js/components/cartDrawer.js?v=41"></script>
  <script src="assets/js/components/quickAddModal.js?v=41"></script>
  <script src="assets/js/components/sizeGuideModal.js?v=19"></script>
  <script src="assets/js/pages/product.js?v=25"></script>
</body>
</html>
